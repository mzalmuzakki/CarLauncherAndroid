name: Build Orca Home launcher

on:
  push:
    paths:
      - 'launcher/**'
      - '!launcher/orca-home.apk'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push matters; an older build finishing later would race it to commit the APK.
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The signing key lives in two repository secrets (Settings > Secrets and variables >
      # Actions): ORCAHOME_KEYSTORE_B64 (the keystore, base64) and ORCAHOME_KEY_PASSWORD.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ORCAHOME_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ORCAHOME_KEYSTORE_B64 is missing: the APK can't be signed (see README, Building)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orcahome.jks"
          echo "ORCAHOME_KEYSTORE=$RUNNER_TEMP/orcahome.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ORCAHOME_KEY_PASSWORD: ${{ secrets.ORCAHOME_KEY_PASSWORD }}
        run: gradle -p launcher assembleRelease --no-daemon --stacktrace

      - name: Copy APK
        run: cp launcher/app/build/outputs/apk/release/app-release.apk launcher/orca-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orca-home
          path: launcher/orca-home.apk

      # Commit the APK so `git pull` + scripts/launcher.sh is all that's needed.
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/orca-home.apk
          git commit -m "Build Orca Home APK [skip ci]" || exit 0
          git pull --rebase
          git push
